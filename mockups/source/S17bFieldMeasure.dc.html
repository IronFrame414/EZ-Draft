<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Draft field measure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
.mono{font-family:'DM Mono',monospace}
.chip{flex:none;border:1px solid #dfe2e6;background:#fff;border-radius:999px;padding:7px 12px;font:500 13px 'Instrument Sans',sans-serif;color:#3b424d}
.chipon{background:#eef1ff;border-color:oklch(0.55 0.17 262);color:oklch(0.42 0.17 262);font-weight:600}
.shape{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid #dfe2e6;border-radius:10px;background:#fff;font:500 11px 'Instrument Sans',sans-serif;color:#5e6672}
.shapeon{border:2px solid oklch(0.55 0.17 262);padding:7px 3px;color:oklch(0.42 0.17 262);font-weight:600;background:#f7f8ff}
.k{height:46px;border:0;border-radius:9px;background:#fff;font:500 19px 'DM Mono',monospace;color:#14171c;box-shadow:0 1px 0 #c9ced5}
.kf{font:500 14px 'DM Mono',monospace;background:#e9ecf1}
.kk{background:oklch(0.55 0.17 262);color:#fff;font:600 15px 'Instrument Sans',sans-serif;box-shadow:none}
.wl{font:500 12px 'DM Mono',monospace;fill:#14171c}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f7f9; font-family: 'Instrument Sans', sans-serif; color: #14171c; display: flex; flex-direction: column">
<header style="flex: none; padding: 12px 16px 10px; background: #fff; border-bottom: 1px solid #dfe2e6; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5e6672"><span class="ms" style="font-size: 18px">arrow_back</span>EZ Binder<span style="flex: 1"></span><span style="display: flex; align-items: center; gap: 4px; color: oklch(0.42 0.12 150)"><span class="ms" style="font-size: 16px">cloud_done</span>Saved on phone</span></div>
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; font-weight: 600">Field measure</span><span style="font-size: 12px; color: #5e6672">Hendricks residence</span></div>
<div style="display: flex; gap: 6px; overflow: hidden"><button class="chip">Building</button><button class="chip">Kitchen</button><button class="chip chipon">Family room</button><button class="chip">Laundry</button><button class="chip" style="display: flex; align-items: center; gap: 2px"><span class="ms" style="font-size: 16px">add</span>Room</button></div>
</header>
<main style="flex: 1; min-height: 0; padding: 10px 14px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 6px">
<button class="shape"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><rect x="2" y="2" width="30" height="18" style="fill: none; stroke: currentColor; stroke-width: 2"></rect></svg>Rectangle</button>
<button class="shape shapeon"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M2 2 H32 V12 H16 V20 H2 Z" style="fill: none; stroke: currentColor; stroke-width: 2"></path></svg>L-shape</button>
<button class="shape"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M2 2 H32 V10 H22 V20 H12 V10 H2 Z" style="fill: none; stroke: currentColor; stroke-width: 2"></path></svg>T-shape</button>
<button class="shape"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M2 2 H32 V20 H24 V9 H10 V20 H2 Z" style="fill: none; stroke: currentColor; stroke-width: 2"></path></svg>U-shape</button>
<button class="shape"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M3 18 L8 3 L20 6 L31 4 L28 19 Z" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 3 2"></path></svg>Walls</button>
</div>
<div style="background: #fff; border: 1px solid #dfe2e6; border-radius: 12px; padding: 8px; position: relative">
<svg viewBox="0 0 340 236" role="img" aria-label="L-shaped family room outline with walls A to F; wall C selected; four walls measured, one blank" style="width: 100%; display: block">
<path d="M40 30 H300 V120 H170 V206 H40 Z" style="fill: #f3f5f8; stroke: #3b424d; stroke-width: 5; stroke-linejoin: round"></path>
<line x1="300" y1="120" x2="170" y2="120" style="stroke: oklch(0.55 0.17 262); stroke-width: 7; stroke-linecap: round"></line>
<g style="font: 600 11px 'Instrument Sans', sans-serif">
<circle cx="170" cy="14" r="9" style="fill: #14171c"></circle><text x="170" y="18" style="fill: #fff; text-anchor: middle">A</text>
<circle cx="318" cy="75" r="9" style="fill: #14171c"></circle><text x="318" y="79" style="fill: #fff; text-anchor: middle">B</text>
<circle cx="235" cy="138" r="9" style="fill: oklch(0.55 0.17 262)"></circle><text x="235" y="142" style="fill: #fff; text-anchor: middle">C</text>
<circle cx="188" cy="163" r="9" style="fill: #14171c"></circle><text x="188" y="167" style="fill: #fff; text-anchor: middle">D</text>
<circle cx="105" cy="222" r="9" style="fill: #9aa3af"></circle><text x="105" y="226" style="fill: #fff; text-anchor: middle">E</text>
<circle cx="22" cy="118" r="9" style="fill: #14171c"></circle><text x="22" y="122" style="fill: #fff; text-anchor: middle">F</text>
</g>
<text x="170" y="48" class="wl" style="text-anchor: middle">18' 2"</text>
<text x="290" y="79" class="wl" style="text-anchor: end">9' 0 1/2"</text>
<rect x="196" y="98" width="78" height="18" rx="4" style="fill: oklch(0.55 0.17 262)"></rect><text x="235" y="111" class="wl" style="fill: #fff; text-anchor: middle">10' 4…</text>
<text x="160" y="166" class="wl" style="text-anchor: end">7' 3"</text>
<text x="105" y="198" class="wl" style="text-anchor: middle; fill: #9aa3af">—</text>
<text x="52" y="122" class="wl">16' 3 1/2"</text>
</svg>
<div style="position: absolute; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: oklch(0.48 0.13 65); background: oklch(0.96 0.04 80); border-radius: 999px; padding: 4px 10px"><span class="ms" style="font-size: 15px">straighten</span>E fills in when the room closes</div>
</div>
<div style="display: flex; gap: 8px">
<div style="flex: 1; background: #fff; border: 2px solid oklch(0.55 0.17 262); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: oklch(0.45 0.17 262); font-weight: 600">Wall C</span><span class="mono" style="font-size: 22px">10' 4 1/<span style="display: inline-block; width: 2px; height: 22px; background: oklch(0.55 0.17 262); vertical-align: -4px"></span></span></div>
<div style="width: 112px; background: #fff; border: 1px solid #dfe2e6; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5e6672">Ceiling at wall</span><span class="mono" style="font-size: 18px">9' 0"</span></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5e6672"><span>Tap a wall or Next. Openings and details go on desktop.</span><span class="mono">3 / 6</span></div>
</main>
<div style="flex: none; background: #d9dde3; padding: 8px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<button class="k">1</button><button class="k">2</button><button class="k">3</button><button class="k kf">'</button><button class="k kf">"</button>
<button class="k">4</button><button class="k">5</button><button class="k">6</button><button class="k kf">1/2</button><button class="k kf">1/4</button>
<button class="k">7</button><button class="k">8</button><button class="k">9</button><button class="k kf">1/8</button><button class="k kf">1/16</button>
<button class="k kf"><span class="ms" style="font-size: 20px">backspace</span></button><button class="k">0</button><button class="k kf">sp</button><button class="k kk" style="grid-column: span 2">Next wall</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
