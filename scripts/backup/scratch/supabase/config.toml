# EZD-025 Step 5 (vault/plans/EZD-025.md): the scratch Supabase stack for the restore drill. A second local CLI
# stack on its own ports (EZD-004a's stack uses 54320-54329), started with --workdir on a temporary copy of this
# folder plus the repo's migrations up to the dump's version. It needs Postgres, Auth, Storage and the API
# gateway only. Nobody signs in to it, so it has no auth hooks and no email templates.

project_id = "ezdraft-restore"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329

[db.migrations]
enabled = true

[db.seed]
enabled = false

# EZD-018's migrations use realtime.messages, which exists only with Realtime on (plan Step 5 fallback).
[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = false

[analytics]
enabled = false
