<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Draft projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0">
<style>
body{margin:0}
a{color:oklch(0.5 0.17 262)}a:hover{color:oklch(0.42 0.17 262)}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
.mono{font-family:'DM Mono',monospace}
.card{background:#fff;border:1px solid #dfe2e6;border-radius:12px;box-shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.07)}
.b{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;font:500 14px 'Instrument Sans',sans-serif;border:1px solid #dfe2e6;border-radius:8px;background:#fff;color:#14171c;cursor:pointer;text-decoration:none}
.b:hover{border-color:#c9ced5}
.bp{padding:9px 16px;font-weight:600;background:oklch(0.55 0.17 262);border-color:oklch(0.55 0.17 262);color:#fff}
.bp:hover{background:oklch(0.5 0.17 262)}
.ft{border:0;background:transparent;padding:7px 12px;border-radius:7px;font:500 13px 'Instrument Sans',sans-serif;color:#5e6672;cursor:pointer}
.fton{background:#eef1ff;color:oklch(0.45 0.17 262);font-weight:600}
.pc{display:flex;flex-direction:column;text-decoration:none;color:#14171c;overflow:hidden}
.pc:hover{border-color:#c9ced5}
.th{height:168px;background-color:#f6f7f9;background-image:linear-gradient(#e6e9ed 1px,transparent 1px),linear-gradient(90deg,#e6e9ed 1px,transparent 1px);background-size:16px 16px;border-bottom:1px solid #eef0f3;display:flex;align-items:center;justify-content:center}
.wl{fill:none;stroke:#3b424d;stroke-width:6}
.cb{fill:#fff;stroke:#7a828e;stroke-width:1.2}
.nw{fill:oklch(0.95 0.03 262);stroke:oklch(0.55 0.17 262);stroke-width:1.4}
.pill{font:600 12px 'Instrument Sans',sans-serif;padding:4px 9px;border-radius:999px;white-space:nowrap}
.mi{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;font:500 14px 'Instrument Sans',sans-serif;color:#14171c}
.mi:hover{background:#f2f4f7}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; position: relative; overflow: hidden; background: #f6f7f9; font-family: 'Instrument Sans', sans-serif; color: #14171c; display: flex; flex-direction: column">
<header class="card" style="height: 60px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; margin: 16px 16px 0">
<div style="display: flex; align-items: baseline; gap: 1px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em"><span>ez</span><span style="color: oklch(0.55 0.17 262)">draft</span></div>
<span style="width: 1px; height: 24px; background: #dfe2e6"></span>
<span style="font-size: 15px; font-weight: 600">Projects</span>
<a href="#" style="font-size: 13px; color: #5e6672; text-decoration: none; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 16px">arrow_back</span>EZ Contractor Binder</a>
<div style="flex: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; width: 340px; height: 38px; box-sizing: border-box; border: 1px solid #dfe2e6; border-radius: 8px; padding: 0 12px; color: #5e6672">
<span class="ms" style="font-size: 20px">search</span>
<input aria-label="Search projects" placeholder="Search client, address or project" style="border: 0; outline: none; flex: 1; font: 400 14px 'Instrument Sans', sans-serif; color: #14171c">
<span class="mono" style="font-size: 12px; border: 1px solid #dfe2e6; border-radius: 5px; padding: 1px 6px">/</span>
</label>
<button class="b" aria-label="Notifications, 3 new" style="position: relative; padding: 9px 10px"><span class="ms" style="font-size: 20px">notifications</span><span style="position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: oklch(0.72 0.16 65)"></span></button>
<a href="#" class="b" style="padding: 9px 10px" aria-label="Company settings"><span class="ms" style="font-size: 20px">settings</span></a>
<span style="width: 32px; height: 32px; border-radius: 50%; background: #14171c; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">JB</span>
</header>
<main style="flex: 1; min-height: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Projects</h1>
<div class="card" style="display: flex; gap: 2px; padding: 4px; border-radius: 10px; box-shadow: none">
<button class="ft fton">All <span class="mono">6</span></button>
<button class="ft">Draft</button>
<button class="ft">Client review</button>
<button class="ft">Permit submitted</button>
<button class="ft">Approved</button>
<button class="ft">In build</button>
</div>
<div style="flex: 1"></div>
<button class="b"><span class="ms" style="font-size: 18px">sort</span>Last edited</button>
<div style="position: relative">
<button class="b bp"><span class="ms" style="font-size: 18px">add</span>New project<span class="ms" style="font-size: 18px">expand_more</span></button>
<div class="card" style="position: absolute; right: 0; top: 46px; width: 300px; padding: 6px; display: flex; flex-direction: column; z-index: 2">
<button class="mi"><span class="ms" style="font-size: 20px; color: oklch(0.5 0.17 262)">link</span><span style="display: flex; flex-direction: column; gap: 2px">From an EZ Binder job<span style="font-weight: 400; font-size: 12px; color: #5e6672">Client, address and job number fill in</span></span></button>
<button class="mi"><span class="ms" style="font-size: 20px; color: #3b424d">edit_square</span><span style="display: flex; flex-direction: column; gap: 2px">Standalone<span style="font-weight: 400; font-size: 12px; color: #5e6672">Type the details here</span></span></button>
<span style="height: 1px; background: #eef0f3; margin: 4px 8px"></span>
<button class="mi"><span class="ms" style="font-size: 20px; color: #3b424d">upload_file</span><span style="display: flex; flex-direction: column; gap: 2px">Start from a file<span style="font-weight: 400; font-size: 12px; color: #5e6672">Polycam scan, PDF or DXF</span></span></button>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
<a href="#" class="card pc">
<div class="th">
<svg width="220" height="128" viewBox="0 0 220 128" aria-hidden="true"><path class="wl" d="M70 118 H210 V10 H10 V118 H40"></path><rect class="cb" x="96" y="13" width="26" height="22"></rect><rect class="cb" x="122" y="13" width="40" height="22"></rect><rect class="cb" x="162" y="13" width="45" height="22"></rect><rect class="nw" x="74" y="62" width="40" height="34"></rect><rect class="nw" x="114" y="62" width="40" height="34"></rect></svg>
</div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{p.name}}</span><span class="pill" style="{{p.statusStyle}}">{{p.status}}</span></div>
<span style="font-size: 13px; color: #5e6672">{{p.client}} · {{p.address}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #5e6672"><span class="mono">{{p.version}}</span><span style="display: flex; align-items: center; gap: 5px; color: {{p.openColor}}; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{p.openDot}}"></span>{{p.open}}</span></div>
</div>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const st = {
'Draft': 'background: #f2f4f7; color: #5e6672',
'Client review': 'background: #eef1ff; color: oklch(0.45 0.17 262)',
'Permit submitted': 'background: oklch(0.96 0.04 80); color: oklch(0.48 0.13 65)',
'Approved': 'background: oklch(0.95 0.05 150); color: oklch(0.42 0.12 150)',
'In build': 'background: #14171c; color: #ffffff'
};
const rows = [
['Kitchen remodel', 'Hendricks residence', 'Permit submitted', 'Rev 0', 2],
['Primary bath', '[Client B]', 'Client review', 'Version 2 sent', 1],
['Family room vault + beams', '[Client C]', 'Client review', 'Version 3 sent', 0],
['Whole-home interior', '[Client D]', 'Permit submitted', 'Rev 0', 0],
['Guest bath', '[Client E]', 'Approved', 'Rev 1', 0],
['Kitchen + laundry', '[Client F]', 'In build', 'Rev 2', 3]
];
return {
projects: rows.map(r => ({
name: r[0], client: r[1], address: '[Address]', status: r[2], version: r[3],
statusStyle: st[r[2]],
open: r[4] ? r[4] + ' to review' : 'Nothing to review',
openColor: r[4] ? 'oklch(0.48 0.13 65)' : '#9aa3af',
openDot: r[4] ? 'oklch(0.72 0.16 65)' : '#dfe2e6'
}))
};
}
}
</script>
</body>
</html>
