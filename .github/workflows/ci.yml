name: CI
# Runs:
#  - on every push to develop, so a red develop shows the same day (H7, Josh 2026-11-01)
#  - on the phase PR (develop -> main), which branch protection requires ("gate")
#  - by hand from the Actions tab (Run workflow)
# Per-ticket checks run locally with `node scripts/gate.mjs`; a newer push cancels an older run.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep the local Supabase ports out of the ephemeral range
        # D-006: Linux hands out outgoing ports from 32768-60999, so a download can hold 54322
        # when the database container binds it (CI run 41465530458, attempt 1). First, before any download.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install browsers (once browser tests exist)
        if: hashFiles('playwright.config.*') != ''
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium webkit
      - name: Record views from the last snapshot
        # REMEDIATION-PLAN 2.14: the running records are not in git; CI reads the last committed snapshot.
        run: node scripts/records.mjs views-from-snapshot
      - name: Ledger check
        run: node vault/tools/next_ticket.mjs --check
      - name: Gate
        run: node scripts/gate.mjs .
      - name: Performance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results/
          if-no-files-found: ignore
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs
          path: |
            gate-failures.log
            gate.log
          if-no-files-found: ignore
