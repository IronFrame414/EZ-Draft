name: CI
# Runs:
#  - on every push to develop, so a red develop shows the same day (H7, Josh 2026-11-01)
#  - on the phase PR (develop -> main), which branch protection requires ("gate")
#  - by hand from the Actions tab (Run workflow)
# Build v3 (2026-11-13): the gate is `node scripts/check.mjs` (app checks only), the same script the build loop runs locally.
# A newer push cancels an older run.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    # EZD-336: 45, not 30. Runs take 17-19 minutes; on 2026-11-05 a stalled Ubuntu package mirror in the browser install held
    # push run 42049298178 past 30 minutes, and its cancelled gate check blocked PR 5 for 3.5 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep the local Supabase ports out of the ephemeral range
        # D-006: Linux hands out outgoing ports from 32768-60999, so a download can hold 54322
        # when the database container binds it (CI run 41465530458, attempt 1). First, before any download.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install -g pnpm@12.14.0
      - name: Install dependencies and browsers
        run: pnpm install --frozen-lockfile && pnpm --filter app exec playwright install --with-deps chromium webkit
      - name: Gate
        env:
          EZD_LANE: '0'
        run: node scripts/check.mjs .
      - name: Performance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results/
          if-no-files-found: ignore
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs
          path: |
            check-failures.log
            check.log
          if-no-files-found: ignore
