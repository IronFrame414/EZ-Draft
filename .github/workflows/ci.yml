name: CI
# Runs only when it matters, to save Actions minutes and Vercel builds:
#  - on the phase PR (develop -> main), which branch protection requires ("gate")
#  - by hand from the Actions tab (Run workflow)
# Per-ticket checks run locally with `node scripts/gate.mjs`; CI is the final check per phase.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install browsers (once browser tests exist)
        if: hashFiles('playwright.config.*') != ''
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium webkit
      - name: Ledger check
        run: node vault/tools/next_ticket.mjs --check
      - name: Gate
        run: node scripts/gate.mjs .
      - name: Performance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results/
          if-no-files-found: ignore
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs
          path: |
            gate-failures.log
            gate.log
          if-no-files-found: ignore
