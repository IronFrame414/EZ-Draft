name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install browsers (once browser tests exist)
        if: hashFiles('playwright.config.*') != ''
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium webkit
      - name: Gate
        run: node scripts/gate.mjs .
